<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Тушь">
<meta name="theme-color" content="#f4efe4">
<meta name="color-scheme" content="light">
<title>Тушь</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Golos+Text:wght@400;500;600&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f4efe4;--paper2:#eae3d3;--ink:#1c1a17;--mute:#6b655b;--red:#c8301f;--blue:#25405e;--line:#d8cfbd;
    --ink1:#3a3631;--ink2:#5b564d;--ink3:#8a8170;--ink4:#b8ae9a;--off:#c8b9a3;--red-d:#a3271a;
    --serif:'Lora',Georgia,'Times New Roman',serif;--sans:'Golos Text',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --cn:'Noto Serif SC','Songti SC','STSong','SimSun',serif;--navh:64px;color-scheme:light}
  *{box-sizing:border-box}
  html{background:var(--paper);-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;
    -webkit-tap-highlight-color:transparent}
  .app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}
  @media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
  main{padding:calc(16px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(var(--navh) + 28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  @media (min-width:400px){main{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}}
  .tab{display:flex;flex-direction:column;gap:14px}
  .tab[hidden],[hidden]{display:none!important}
  .vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  button,a{font:inherit;color:inherit}
  button{background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer}
  button:disabled{cursor:default}
  a{color:var(--red)}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
  .cn{font-family:var(--cn)}
  .serif{font-family:var(--serif)}
  .mute{color:var(--mute)}
  .sub{font-size:13px;color:var(--mute)}
  .rule{border-bottom:1px solid var(--line);padding-bottom:14px}
  .grow{flex:1;min-width:0}
  h2{margin:0;font-family:var(--serif);font-size:17px;font-weight:600}
  .row{display:flex;align-items:center;gap:12px}
  .seal{display:inline-flex;align-items:center;justify-content:center;font-family:var(--cn);font-weight:900;border-radius:4px;flex:none}
  .seal.on{background:var(--red);color:var(--paper)}
  .seal.off{border:2px solid var(--off);color:var(--off)}
  /* Сегодня */
  .hd{display:flex;align-items:center;gap:10px}
  .t1{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.2}
  .lvl{width:48px;height:48px;border:2px solid var(--red);border-radius:6px;color:var(--red);display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-family:var(--cn);font-weight:900;font-size:13px;line-height:1.05;transform:rotate(-4deg);text-align:center}
  .goal{display:flex;align-items:center;gap:18px}
  .enso{flex:none;width:120px;height:120px}
  .enso-hz{width:120px;height:120px;position:relative;flex:none;border-radius:50%}
  .enso-hz .enso{position:absolute;inset:0}
  .enso-hz span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--cn);font-weight:700;font-size:40px}
  .big{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.15}
  .cont{display:flex;align-items:center;gap:12px;width:100%;min-height:44px}
  .kicker{font-size:12px;letter-spacing:.08em;color:var(--red);font-weight:600;text-transform:uppercase}
  .cont .ttl{font-family:var(--serif);font-size:20px;font-weight:600;display:block;line-height:1.2;margin:2px 0}
  .bar{display:flex;gap:2px;margin:6px 0 4px}
  .bar i{flex:1;height:6px;display:block}
  .go{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;flex:none}
  .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .stat{display:flex;flex-direction:column;gap:2px;min-height:44px}
  .stat b{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1}
  .quests{display:flex;flex-direction:column;gap:2px}
  .q{display:flex;align-items:center;gap:12px;min-height:44px;width:100%;font-size:15px}
  .q .dot{width:22px;height:22px;border:1.5px solid var(--ink);border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
  .q.done{color:var(--mute)}
  .q.done .dot{border:0;background:var(--red);color:var(--paper)}
  .q.done .qt{text-decoration:line-through}
  /* Путь */
  .hsk{display:flex;gap:8px;font-size:13px;flex-wrap:wrap;align-items:baseline}
  .hsk .sep{color:var(--ink4)}
  .les{border-bottom:1px solid var(--line);padding-bottom:12px;display:flex;flex-direction:column;gap:10px}
  .les-h{display:flex;align-items:center;gap:14px;width:100%;min-height:48px}
  .les-h .num{font-family:var(--cn);font-weight:900;font-size:40px;line-height:1;min-width:44px;text-align:center}
  .les.open .les-h .num{font-size:54px}
  .les.fresh .num{color:var(--ink3)}
  .les-h .lt{font-family:var(--serif);font-size:17px;font-weight:600;display:block;line-height:1.25}
  .les.open .les-h .lt{font-size:19px}
  .due{color:var(--blue)}
  .topics{display:flex;flex-direction:column;padding-left:4px}
  .tp{display:flex;align-items:center;gap:10px;min-height:44px;width:100%;font-size:15px}
  .tp .c{width:14px;height:14px;border-radius:50%;flex:none;border:1.5px solid var(--ink4)}
  .tp.cur{font-weight:600}
  .tp.cur .c{border:2px solid var(--red)}
  .tp .p{font-size:13px;color:var(--mute)}
  .tp.cur .p{color:var(--red)}
  .boss{display:flex;align-items:center;gap:10px;min-height:44px;font-size:13px;color:var(--mute);margin-left:auto}
  .boss .seal{width:36px;height:36px;font-size:17px;transform:rotate(-5deg)}
  .mini .seal{width:38px;height:38px;font-size:18px;transform:rotate(-5deg)}
  /* Практика */
  .pr{display:flex;align-items:center;gap:14px;min-height:64px;width:100%;border-bottom:1px solid var(--line);padding:8px 0}
  .pr .g{font-family:var(--cn);font-weight:900;font-size:30px;width:44px;text-align:center;flex:none}
  .pr .n{font-family:var(--serif);font-size:18px;font-weight:600}
  .pr:disabled{color:var(--mute)}
  .pr:disabled .g{color:var(--ink4)}
  /* Профиль */
  .sync-f{display:flex;gap:8px}
  .sync-f input{flex:1;min-width:0;min-height:44px;box-sizing:border-box;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;
    background:var(--paper);color:var(--ink);font:inherit;font-size:16px}
  .sync-f input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .sync-f button{min-height:44px;padding:0 16px;border-radius:10px;background:var(--ink);color:var(--paper);font-weight:600;text-align:center}
  .sync-f button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .me-h{display:flex;align-items:center;gap:14px}
  .me-h .num{font-family:var(--cn);font-weight:900;font-size:60px;line-height:1}
  .xpbar{height:4px;background:var(--paper2);margin-top:8px}
  .xpbar i{display:block;height:100%;background:var(--ink)}
  .sec{display:flex;flex-direction:column;gap:8px;padding-top:8px;border-top:1px solid var(--line)}
  .sec-h{display:flex;align-items:baseline;gap:8px}
  .sec-h .sub{margin-left:auto}
  .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:end;height:130px}
  .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .col b{font-family:var(--serif);font-size:18px;font-weight:600}
  .col i{display:block;width:30px;border-radius:3px 3px 0 0}
  .col span{font-size:12px;color:var(--mute);text-align:center}
  .stg{display:flex;height:26px;background:var(--paper2)}
  .stg i{display:block;height:100%}
  .leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute)}
  .leg span{display:inline-flex;align-items:center;gap:5px}
  .leg i{width:10px;height:10px;display:inline-block;border:1px solid var(--ink4)}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;justify-items:center}
  .cal .wd{font-size:11px;color:var(--mute)}
  .cal .d{width:24px;height:24px;border-radius:50%;display:block}
  .cal .d.fut{border:1px dashed var(--ink4)}
  .cal .d.today{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--red)}
  .seals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 8px;text-align:center;font-size:11px;color:var(--mute)}
  .seals>div{display:flex;flex-direction:column;align-items:center;gap:5px}
  .seals .seal{width:46px;height:46px;font-size:22px}
  /* навигация */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:480px;margin:0 auto;background:var(--paper2);
    display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px max(4px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(4px,env(safe-area-inset-left))}
  .nav>*{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:50px;color:var(--mute);
    text-decoration:none;font-size:11px;text-align:center}
  .nav .cn{font-size:20px;line-height:1.2}
  .nav [aria-current="page"]{color:var(--red-d);font-weight:600}
  .nav [aria-current="page"] .cn{font-weight:700}
  .session{position:fixed;inset:0;z-index:10;background:var(--paper);overflow:auto;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .session>div{max-width:480px;margin:0 auto;min-height:100%}
</style>
</head>
<body>
<div class="app">
  <main id="main">
    <section class="tab" id="tab-today" aria-labelledby="h-today"><h1 class="vh" id="h-today">Сегодня</h1><div class="tab" id="today"></div></section>
    <section class="tab" id="tab-path" aria-labelledby="h-path" hidden><h1 class="vh" id="h-path">Путь</h1><div class="tab" id="path"></div></section>
    <section class="tab" id="tab-practice" aria-labelledby="h-practice" hidden><h1 class="vh" id="h-practice">Практика</h1><div id="practice"></div></section>
    <section class="tab" id="tab-me" aria-labelledby="h-me" hidden><h1 class="vh" id="h-me">Профиль</h1><div class="tab" id="me"></div><div class="tab" id="me-sync"></div></section>
  </main>
  <section class="session" id="session" role="dialog" aria-modal="true" aria-label="Занятие" hidden><div id="session-root"></div></section>
  <nav class="nav" aria-label="Разделы">
    <button type="button" data-tab="today"><span class="cn" aria-hidden="true">今</span>Сегодня</button>
    <button type="button" data-tab="path"><span class="cn" aria-hidden="true">路</span>Путь</button>
    <button type="button" data-tab="practice"><span class="cn" aria-hidden="true">练</span>Практика</button>

    <button type="button" data-tab="me"><span class="cn" aria-hidden="true">我</span>Профиль</button>
  </nav>
</div>

  /* ---- Профиль ---- */
  function bestStreak() {
    const days = Object.keys(state.calendar || {}).map(Number).filter(d => state.calendar[d] >= 2).sort((a, b) => a - b);
    let best = 0, run = 0, prev = null;
    days.forEach(d => { run = prev != null && d === prev + 1 ? run + 1 : 1; prev = d; if (run > best) best = run; });
    const stored = parseInt(lsGet('zh_tush_best_streak') || '0', 10) || 0;
    best = Math.max(best, stored, state.streak || 0);
    if (best > stored) lsSet('zh_tush_best_streak', String(best));
    return best;
  }
  function renderMe() {
    const s = state;

      '<div class="serif" style="font-size:20px;font-weight:600" data-k="level">Уровень ' + s.level + '</div>' +

      '<div class="xpbar" role="img" aria-label="' + (next ? 'До следующего уровня ' + pct(s.levelXp / next) : 'Максимальный уровень') + '"><i style="width:' + (next ? Math.round(s.levelXp / next * 100) : 100) + '%"></i></div></div></header>';

      '<div class="stg" role="img" aria-label="' + ORDER.map(o => o[1] + ' ' + (st[o[0]] || 0)).join(', ') + '">' +
      ORDER.map(o => (st[o[0]] ? '<i style="width:' + (st[o[0]] / total * 100).toFixed(2) + '%;background:' + o[2] + '"></i>' : '')).join('') + '</div>' +
      '<div class="leg">' + ORDER.map(o => '<span data-k="stage-' + o[0] + '"><i style="background:' + o[2] + '"></i>' + o[1] + ' ' + fmt(st[o[0]] || 0) + '</span>').join('') + '</div></section>';
    // календарь
    const t = s.today, dt = new Date(t * 86400000), y = dt.getUTCFullYear(), m = dt.getUTCMonth();
    const first = Math.round(Date.UTC(y, m, 1) / 86400000), dim = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();

        k + ' ' + MONTHS[m].toLowerCase() + (fut ? '' : ': ' + Math.round(x) + ' мин') + (dn === t ? ', сегодня' : '') + '" style="background:' + (fut ? 'transparent' : calInk(x)) + '"></span>';

      }).join('') + '</div></section>';
    $('#me').innerHTML = h;
  }

  /* ---- ключ синхронизации (в приложении с экрана «Домой» своё хранилище — ключ вводится здесь) ---- */
  function parseKey(v) {
    v = String(v || '').trim();
    const m = /(?:^|[#&?])key=([^&\s]+)/.exec(v);
    if (m) { try { v = decodeURIComponent(m[1]); } catch (e) { v = m[1]; } }
    return v.trim();
  }
  const KEY_RE = /^[A-Za-z0-9_\-.~+\/=]{16,200}$/;
  let syncErr = null;                // результат последней синхронизации: null | 'auth' | 'network' | …
  function syncText(r) {
    if (!r) return 'ключ сохранён, нет сети';
    if (r.ok) return 'включена';
    if (r.error === 'auth') return 'ключ не подошёл';
    if (r.error === 'no_key') return 'выключена';
    return 'ключ сохранён, нет сети';
  }
  function syncStatus(msg, bad) {
    const el = $('#sync-st');
    if (!el) return;
    if (!msg) { msg = !hasKey() ? 'выключена' : syncErr === 'auth' ? 'ключ не подошёл' : syncErr ? 'нет сети' : 'включена'; bad = syncErr === 'auth' && hasKey(); }
    el.textContent = msg;
    el.style.color = bad ? 'var(--red)' : '';
  }
  function renderSync() {
    const box = $('#me-sync');
    if (!box || box.dataset.ready) return;
    box.dataset.ready = '1';
    box.innerHTML = '<section class="sec"><div class="sec-h"><h2>Синхронизация</h2><span class="sub" id="sync-st" role="status" aria-live="polite"></span></div>' +
      '<form class="sync-f" id="sync-form" autocomplete="off"><label class="vh" for="sync-key">Ключ синхронизации</label>' +
      '<input id="sync-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ключ или ссылка">' +
      '<button type="submit">Сохранить</button></form>' +
      '<a href="./talk-check.html" data-href="./talk-check.html" style="min-height:44px;display:inline-flex;align-items:center">Проверка голоса</a></section>';
    syncStatus();
    $('#sync-form').addEventListener('submit', async ev => {
      ev.preventDefault();
      const inp = $('#sync-key'), k = parseKey(inp.value);
      if (!KEY_RE.test(k)) { syncStatus(k ? 'это не ключ' : 'нужен ключ', true); return; }   // прежний ключ не трогаем
      lsSet('zh_talk_key', k);
      inp.value = '';
      if (!S) { syncStatus('ключ сохранён'); return; }
      syncStatus('проверяю…');
      let r = null;
      // первая синхронизация могла уже идти со старым ключом — дожидаемся её и проверяем новым ключом отдельно
      try { await S.sync(); } catch (e) { /* итог — по второй */ }
      try { r = await S.sync(); } catch (e) { r = null; }
      syncErr = r && r.ok ? null : (r && r.error) || 'network';
      syncStatus(syncText(r), !!(r && r.error === 'auth'));
      if (r && r.ok && r.pulled) refresh();
    });
  }

  /* ---- вкладки ---- */
  const TABS = ['today', 'path', 'practice', 'me'];
  function render() {
    if (!state) return;
    renderToday(); renderPath(); renderPractice(); renderMe(); renderSync();
    showTab(tab, false);
  }
  function showTab(name, push) {
    if (TABS.indexOf(name) < 0) name = 'today';
    tab = name;
    TABS.forEach(t => { $('#tab-' + t).hidden = t !== name; });
    document.querySelectorAll('.nav [data-tab]').forEach(b => {
      if (b.dataset.tab === name) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    if (push) { try { history.replaceState(null, '', '#' + name); } catch (e) { /* file:// */ } window.scrollTo(0, 0); }
  }
  App.showTab = n => showTab(n, true);
  function say(hz) {
    try {
      const u = new SpeechSynthesisUtterance(hz); u.lang = 'zh-CN'; u.rate = 0.8;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch (e) { /* нет синтеза речи */ }
  }
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-tab],[data-go],[data-act],[data-href]');
    if (!el || el.disabled) return;
    if (el.dataset.tab) return showTab(el.dataset.tab, true);
    if (el.dataset.go) return showTab(el.dataset.go, true);
    if (el.dataset.href) return App.navigate(el.dataset.href);
    const a = el.dataset.act, lesson = el.dataset.lesson, topic = el.dataset.topic != null ? Number(el.dataset.topic) : null;
    if (a === 'toggle') { expanded = expanded === lesson ? '' : lesson; renderPath(); const b = $('.les[data-lesson="' + lesson + '"] .les-h'); if (b) b.focus(); return; }
    if (a === 'say') return say(el.dataset.hz);
    if (a === 'review' || a === 'tones') return launch(a, {});
    if (a === 'boss') return launch('boss', { lesson: lesson });
    if (a === 'topic') return launch('topic', { lesson: lesson, topic: topic });
    if (a === 'lesson') {
      const st = state.lessons[lesson], ti = st ? st.topics.findIndex(t => t.passed < 1) : -1;
      return launch('topic', { lesson: lesson, topic: ti < 0 ? 0 : ti });
    }
  });
  window.addEventListener('hashchange', () => { captureKey(); const h = (location.hash || '').slice(1); if (TABS.indexOf(h) >= 0) showTab(h, false); });

  async function boot() {
    captureKey();
    const h0 = (location.hash || '').slice(1);
    if (TABS.indexOf(h0) >= 0) tab = h0;
    if (S) {
      try { if (S.init) S.init(); } catch (e) { console.error('Тушь: init', e); }
      try { await S.migrateLegacy(); } catch (e) { console.error('Тушь: перенос', e); }
      try { if (S.onChange) S.onChange(scheduleRefresh); } catch (e) { /* без подписки */ }
    }
    await refresh();
    if (S && hasKey()) {
      syncStatus('проверяю…');
      try {
        const r = await S.sync();
        syncErr = r && r.ok ? null : (r && r.error) || 'network';
        if (r && r.pulled) await refresh();
      } catch (e) { syncErr = 'network'; /* офлайн — работаем локально */ }
      syncStatus();
    }
  }
  // статус синхронизации живой: сеть вернулась или приложение снова на экране — проверяем заново
  async function recheck() {
    if (!S || !hasKey() || document.visibilityState === 'hidden') return;
    let r = null;
    try { r = await S.sync(); } catch (e) { r = null; }
    syncErr = r && r.ok ? null : (r && r.error) || 'network';
    syncStatus();
    if (r && r.pulled) refresh();
  }
  window.addEventListener('online', recheck);
  document.addEventListener('visibilitychange', recheck);
  App.ready = boot();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
  }
})();
</script>

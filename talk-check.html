<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Проверка голоса</title>
<style>
  :root{--paper:#f4efe4;--paper2:#eae3d3;--ink:#1c1a17;--mute:#5d574d;--red:#c8301f;--line:#d8cfbd;--ok:#2f5d3a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 -apple-system,"Golos Text",system-ui,sans-serif}
  main{max-width:520px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 32px;display:flex;flex-direction:column;gap:16px}
  h1{margin:0;font:600 24px/1.2 Lora,Georgia,serif}
  .sub{font-size:13px;color:var(--mute)}
  .heard{min-height:64px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:22px;font-family:"Noto Serif SC","Songti SC",serif}
  .heard.wait{color:var(--mute);font-size:15px;font-family:inherit}
  button{min-height:56px;border-radius:12px;border:0;background:var(--ink);color:var(--paper);font:600 17px/1 inherit;font-family:inherit;padding:0 16px}
  button.rec{background:var(--red)}
  button:disabled{background:transparent;border:1.5px solid var(--line);color:var(--mute)}
  button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
  li b{font-weight:600}
  .y{color:var(--ok)} .n{color:var(--red)}
  a{color:var(--red);min-height:44px;display:inline-flex;align-items:center}
</style>
</head>
<body>
<main>
  <header><h1>Проверка голоса</h1><div class="sub" id="env"></div></header>
  <div class="heard wait" id="heard" aria-live="polite">Нажми «Говорить», скажи фразу по-китайски, затем «Готово».</div>
  <button type="button" id="b">Говорить</button>
  <div class="sub" id="state" role="status" aria-live="polite"></div>
  <ul id="res" aria-label="Итог проверки" hidden></ul>
  <a href="./app.html">← В приложение</a>
</main>
<script>
'use strict';
(function () {
  const $ = (s) => document.querySelector(s);
  const now = () => (window.performance && performance.now) ? performance.now() : Date.now();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  const standalone = !!(window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches));
  const ios = (/OS (\d+)[._](\d+)/.exec(navigator.userAgent) || []).slice(1, 3).join('.') || '-';
  const R = { m: standalone ? 'app' : 'tab', ios: ios, sr: SR ? 1 : 0, tts: window.speechSynthesis ? 1 : 0 };
  window.__zhCheck = R;                                  // для автотеста
  const btn = $('#b');
  $('#env').textContent = (standalone ? 'с иконки' : 'во вкладке') + ' · iOS ' + ios;

  function setState(t) { $('#state').textContent = t; }
  function heard(t, wait) { const h = $('#heard'); h.textContent = t; h.classList.toggle('wait', !!wait); }
  function idle(label) { btn.textContent = label; btn.classList.remove('rec'); btn.disabled = false; mode = 'idle'; }

  // озвучка без жеста: разблокируем пустой репликой в обработчике нажатия
  function unlockTts() {
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); R.u = 1; } catch (e) { /* нет озвучки */ }
  }
  function zhVoice() {
    try { return (speechSynthesis.getVoices() || []).find((v) => /^zh(-|_)CN/i.test(v.lang)) || null; } catch (e) { return null; }
  }

  let mode = 'idle', rec = null, round = 0, finished = 0;
  let tStart = 0, tRelease = 0, firstInterim = 0, interims = 0, finalText = '', gotFinal = false, err = '';

  function startRound() {
    round++;
    interims = 0; firstInterim = 0; finalText = ''; gotFinal = false; err = ''; tRelease = 0;
    if (!SR) { if (round === 1) unlockTts(); err = 'nosr'; finishRound(); return; }   // «Готово» не будет — разблокируем здесь
    try {
      rec = new SR();
      rec.lang = 'zh-CN'; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 1;
    } catch (e) { err = 'ctor'; finishRound(); return; }
    rec.onresult = (ev) => {
      let txt = '', fin = false;
      for (let i = 0; i < ev.results.length; i++) { txt += ev.results[i][0].transcript; if (ev.results[i].isFinal) fin = true; }
      if (!fin) { interims++; if (!firstInterim) firstInterim = now() - tStart; }
      if (txt) heard(txt);
      if (fin) { finalText = txt; if (!gotFinal) { gotFinal = true; R['fl' + round] = tRelease ? Math.round(now() - tRelease) : -1; } }  // -1: итог пришёл сам, до «Готово»
    };
    rec.onerror = (ev) => { err = String((ev && ev.error) || 'error').replace(/[^a-z-]/gi, '').slice(0, 20); };
    rec.onend = () => finishRound();
    tStart = now();
    try { rec.start(); } catch (e) { err = 'start'; finishRound(); return; }
    mode = 'rec'; btn.textContent = 'Готово'; btn.classList.add('rec');
    heard('…', true); setState('Слушаю');
  }
  function stopRound() {
    tRelease = now(); mode = 'wait'; btn.disabled = true;
    if (round === 1) unlockTts();                        // жест «Готово» — после него в диалоге звучит ответ
    setState('Жду итог');
    const r = round;
    try { rec.stop(); } catch (e) { finishRound(); }
    setTimeout(() => { if (round === r) finishRound(); }, 6000);   // свой раунд не закончился сам — не висим
  }
  function finishRound() {
    if (finished >= round) return;
    finished = round;
    try { rec && rec.abort && rec.abort(); } catch (e) { /* уже остановлен */ }
    R['i' + round] = interims ? 1 : 0;
    if (firstInterim) R['fi' + round] = Math.round(firstInterim);
    R['ok' + round] = gotFinal || interims ? 1 : 0;
    if (err) R['e' + round] = err;
    if (round === 1) {
      btn.classList.remove('rec'); btn.textContent = 'Говорить'; btn.disabled = true; mode = 'wait';
      setState('Озвучка через 2 с');
      setTimeout(speakBack, 2000);                       // как будто пришёл ответ сервера — без нового нажатия
    } else {
      report();
    }
  }
  function speakBack() {
    const t0 = now(); let started = false;
    const done = (ok) => {
      if (R.t !== undefined) return;
      R.t = ok ? 1 : 0; if (ok) R.td = Math.round(now() - t0);
      setState(ok ? 'Озвучка сработала. Скажи ещё фразу.' : 'Озвучки не было. Скажи ещё фразу.');
      idle('Ещё раз');
    };
    if (!window.speechSynthesis) { done(false); return; }
    try {
      const u = new SpeechSynthesisUtterance(finalText || '你好，我听到了。');
      u.lang = 'zh-CN'; const v = zhVoice(); if (v) u.voice = v;
      u.onstart = () => { started = true; done(true); };
      u.onerror = () => done(false);
      speechSynthesis.speak(u);
    } catch (e) { done(false); return; }
    setTimeout(() => { if (!started) done(false); }, 3000);
  }
  function report() {
    const q = Object.keys(R).map((k) => k + ':' + encodeURIComponent(String(R[k]))).join(',');
    try { fetch('https://rpg.lavanto.ru/zh-api/health?zhdiag=' + q, { mode: 'no-cors', cache: 'no-store' }).catch(() => {}); } catch (e) { /* офлайн */ }
    const yes = (v) => v ? ['да', 'y'] : ['нет', 'n'];
    const ms = (v) => [v == null ? '—' : v < 0 ? 'сам, до «Готово»' : (v / 1000).toFixed(1).replace('.', ',') + ' с', ''];
    const rows = [
      ['Распознавание есть', yes(R.sr)],
      ['Текст во время речи', yes(R.i1)],
      ['Итог после «Готово»', ms(R.fl1)],
      ['Озвучка без нажатия', yes(R.t)],
      ['Распознавание после озвучки', yes(R.ok2)],
    ];
    const errs = [R.e1, R.e2].filter(Boolean).join(', ');
    if (errs) rows.push(['Ошибка', [errs, 'n']]);
    const ul = $('#res'); ul.textContent = '';
    rows.forEach((r) => {
      const li = document.createElement('li'), a = document.createElement('span'), b = document.createElement('b');
      a.textContent = r[0]; b.textContent = r[1][0]; if (r[1][1]) b.className = r[1][1];
      li.append(a, b); ul.append(li);
    });
    ul.hidden = false;
    btn.hidden = true; mode = 'done';
    setState('Готово — результат отправлен');
  }

  btn.addEventListener('click', () => {
    if (mode === 'rec') stopRound();
    else if (mode === 'idle') startRound();
  });
  if (!SR) setState('Распознавания нет — всё равно нажми «Говорить»');
})();
</script>
</body>
</html>

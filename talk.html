<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Разговор">
<meta name="theme-color" content="#f7f3ee">
<title>Разговор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
  :root{--bg:#f7f3ee;--card:#fff;--ink:#1f1b18;--ink2:#4a423b;--muted:#6b625a;--line:#e7dfd6;--accent:#a8321f;--accent-dk:#7d2416;
    --soft:#f3ebe3;--chip:#ece6df;--due-bg:#fbeee0;--due-ink:#7a4a10;--warn-bg:#fff4e0;--warn-line:#ecd2a4;--warn-ink:#5b3d0c;
    --mark:#c9822b;--in-line:#d8cfc5;--in-bg:#fbf9f6;--err-bg:#fbe9e6;
    --ui:'Golos Text',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --cn:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.4}
  button,input{font-family:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--accent)}a:hover{color:var(--accent-dk)}
  :focus-visible{outline:3px solid #a8321f;outline-offset:2px}
  #s-h:focus{outline:none}
  .app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg)}
  @media (min-width:560px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
  .screen{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
  .cn,.hz,[lang|=zh]{font-family:var(--cn)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  body.nopy .py{display:none!important}
  .status{font-size:14px;color:var(--ink2);min-height:0}
  .status:empty{display:none}
  .status.err{background:var(--err-bg);color:var(--accent-dk);border-radius:12px;padding:8px 12px}
  .linkbtn{background:none;border:0;color:var(--accent);font-size:14px;font-weight:500;min-height:44px;padding:0 10px}
  .linkbtn:hover{color:var(--accent-dk)}
  .btn-p{height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:600;font-size:15px}
  .btn-p:disabled{opacity:.55}
  .btn-s{height:48px;border-radius:12px;border:0;background:var(--chip);color:var(--ink);font-weight:600;font-size:15px}

  /* экран 1: темы */
  .t-head{padding:calc(18px + env(safe-area-inset-top)) 16px 12px;display:flex;flex-direction:column;gap:10px}
  .h1row{display:flex;align-items:baseline;gap:10px}
  h1{margin:0;font-size:26px;font-weight:700}
  .h1row .cn{font-size:18px;color:var(--accent)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-size:13px;padding:6px 10px;border-radius:999px;background:var(--chip);color:var(--ink2)}
  .chip.due{background:var(--due-bg);color:var(--due-ink)}
  .t-body{flex:1;padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
  .pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--accent);
    border-radius:16px;padding:14px;color:var(--ink)}
  .pick .b{flex:1;min-width:0;display:block}
  .pick .k{display:block;font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
  .pick .tt{display:block;font-size:17px;font-weight:600;margin-top:2px}
  .pick .tm{display:block;font-size:13px;color:var(--muted);margin-top:2px}
  .sub{font-size:13px;color:var(--muted);margin-top:6px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--ink);min-height:74px}
  .tile:hover,.pick:hover{border-color:#cdbfb1}
  .pick:hover{border-color:var(--accent-dk)}
  .tile .tt{display:block;font-size:15px;font-weight:600}
  .tile .tm{display:block;font-size:12px;color:var(--muted);margin-top:4px}
  .pick:disabled,.tile:disabled{opacity:.6}
  .more{align-self:center}
  .empty{font-size:14px;color:var(--muted);padding:8px 0}
  .t-foot{position:sticky;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);
    display:flex;gap:8px;align-items:flex-end}
  .own{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
  .own label{font-size:13px;color:var(--ink2)}
  .inp{height:44px;width:100%;border:1px solid var(--in-line);border-radius:12px;padding:0 12px;font-size:16px;background:var(--in-bg)}
  .inp::placeholder{color:#857b72}

  /* экран 2: разговор */
  #s-chat{height:100vh;height:100dvh;min-height:0}
  .c-head{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 12px 10px 8px;background:var(--card);border-bottom:1px solid var(--line)}
  .icon{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border:0;background:none;color:var(--ink);border-radius:12px}
  .c-ttl{flex:1;min-width:0}
  .c-ttl .a{font-size:17px;line-height:1.25;font-weight:600;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
  .c-ttl .b{font-size:13px;line-height:1.3;color:var(--muted);overflow-wrap:anywhere}
  .pyt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);min-height:44px;flex:none;cursor:pointer}
  .pyt input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
  .fin{font-weight:600;font-size:15px;padding:0 8px;flex:none}
  .log{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 8px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:min(300px,86%)}
  .ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:12px 14px}
  .ai .py{font-size:13px;color:var(--muted);line-height:1.3}
  .ai .hz{font-size:24px;line-height:1.35;word-break:break-word}
  .ai .ru{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:14px;color:var(--ink2)}
  .wv{border-bottom:2px dotted var(--mark)}
  .acts{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
  .act{position:relative;min-width:44px;height:36px;padding:0 12px;border:0;background:var(--soft);border-radius:10px;color:var(--ink2);font-size:13px;
    display:inline-flex;align-items:center;justify-content:center}
  .act::after{content:'';position:absolute;left:0;right:0;top:-4px;bottom:-4px}
  .act.ic{padding:0}
  .act[aria-pressed=true],.act[aria-expanded=true]{background:#e9dccf}
  .me{align-self:flex-end;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .me .bub{background:var(--accent);color:#fff;border-radius:18px 4px 18px 18px;padding:12px 14px}
  .me .hz{font-size:22px;line-height:1.35;word-break:break-word}
  .me .py{font-size:13px;color:#f6dcd6;margin-top:4px}
  .me .acts{margin-top:0}
  .better{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--warn-ink)}
  .better .hz{font-size:17px}
  .better .py{font-size:12px;color:#7a5a24;margin-top:2px}
  .c-foot{background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px}
  .weave{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
  .weave .lb{font-size:13px;color:var(--muted)}
  .wchip{font-size:15px;padding:4px 10px;border-radius:999px;background:var(--due-bg);color:var(--due-ink)}
  .weave .done{font-size:13px;color:#2f6b2a}
  .c-foot .status{text-align:center;max-width:100%}
  .mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(168,50,31,.35);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    transition:transform .12s,background .12s}
  .mic.rec{background:var(--accent-dk);transform:scale(1.08);animation:pulse 1.2s ease-out infinite}
  .mic:disabled{opacity:.5;box-shadow:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(168,50,31,.45)}100%{box-shadow:0 0 0 22px rgba(168,50,31,0)}}
  @media (prefers-reduced-motion:reduce){.mic.rec{animation:none;box-shadow:0 0 0 6px rgba(168,50,31,.3)}}
  .mic-hint{font-size:13px;color:var(--muted);text-align:center;-webkit-user-select:none;user-select:none}
  .mic-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
  .txt{display:flex;gap:8px;width:100%}
  .txt .inp{flex:1;min-width:0}
  .small{font-size:13px;color:var(--muted);min-height:44px}

  /* экран 3: разбор */
  .s-head{padding:calc(18px + env(safe-area-inset-top)) 16px 12px;background:var(--card);border-bottom:1px solid var(--line)}
  .s-head .m{font-size:13px;color:var(--muted)}
  .s-head h1{margin:4px 0 12px;font-size:24px}
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .tl{border-radius:12px;padding:10px}
  .tl .n{font-size:22px;font-weight:700}
  .tl .l{font-size:12px}
  .tl.g{background:#eef5ec}.tl.g .n{color:#2f6b2a}.tl.g .l{color:#3f5a3c}
  .tl.a{background:var(--warn-bg)}.tl.a .n{color:#8a5a10}.tl.a .l{color:#6b4c14}
  .tl.r{background:var(--err-bg)}.tl.r .n{color:var(--accent)}.tl.r .l{color:var(--accent-dk)}
  .s-body{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:16px}
  .s-body section{display:flex;flex-direction:column;gap:8px}
  h2{margin:0;font-size:15px;font-weight:600}
  #s-corr{display:flex;flex-direction:column;gap:8px}
  .corr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .corr .was{font-size:16px;color:var(--muted);text-decoration:line-through}
  .corr .now{font-size:18px}
  .corr .rule{font-size:13px;color:var(--muted)}
  .nr{display:flex;gap:8px;flex-wrap:wrap}
  .nrw{display:flex;flex-direction:column;background:var(--err-bg);border-radius:12px;padding:8px 12px}
  .nrw .hz{font-size:18px}
  .nrw .d{font-size:12px;color:var(--accent-dk)}
  .said{font-size:17px;line-height:1.7;color:#2f6b2a}
  .sw{white-space:nowrap}
  .s-foot{position:sticky;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .s-foot .row{display:flex;gap:8px}
  .s-foot .row button{flex:1 1 0;min-width:0;padding:0 12px}  /* у .btn-p свой padding — без этого ширины разные */
  .s-foot .btn-p{height:48px}
  .nokey{flex:1;padding:0 16px;display:flex;flex-direction:column;gap:14px}
  .nokey a{display:inline-flex;align-items:center;align-self:flex-start;min-height:44px;padding:0 4px}
  .nokey .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;font-size:16px}
</style>
</head>
<body>
<div class="app">

<section class="screen" id="s-nokey" hidden>
  <header class="t-head"><div class="h1row"><h1>Разговор</h1><span class="cn" lang="zh-CN">对话</span></div></header>
  <div class="nokey">
    <div class="card"><b>Нужен ключ:</b> открой ссылку на разговор из сообщения Драко.<div class="status" id="k-status" role="status"></div></div>
    <a href="./index.html">← На главную</a>
  </div>
</section>

<section class="screen" id="s-topics" hidden>
  <header class="t-head">
    <div class="h1row"><h1>Разговор</h1><span class="cn" lang="zh-CN">对话</span></div>
    <div class="chips"><span class="chip due" id="c-due">К повторению сегодня: 0</span><span class="chip" id="c-done">Слов пройдено: 0</span></div>
  </header>
  <div class="t-body">
    <div class="status" id="t-status" role="status" aria-live="polite"></div>
    <button type="button" class="pick" id="pick" hidden><span class="b"><span class="k" id="pick-k">Подобрано под повторение</span><span class="tt" id="pick-t"></span><span class="tm" id="pick-m"></span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a8321f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
    <div class="sub" id="grid-h" hidden>Темы уроков</div>
    <div class="grid" id="grid"></div>
    <div class="grid" id="grid-more" hidden></div>
    <button type="button" class="linkbtn more" id="more" aria-expanded="false" aria-controls="grid-more" hidden>Все темы уроков</button>
  </div>
  <form class="t-foot" id="own-form" autocomplete="off">
    <div class="own"><label for="own">Своя тема</label><input class="inp" id="own" type="text" maxlength="100" placeholder="Например: аренда квартиры"></div>
    <button type="submit" class="btn-p" id="own-go">Начать</button>
  </form>
</section>

<section class="screen" id="s-chat" hidden>
  <header class="c-head">
    <button type="button" class="icon" id="back" aria-label="Назад к темам"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="c-ttl"><div class="a" id="c-title"></div><div class="b" id="c-sub"></div></div>
    <label class="pyt"><input type="checkbox" id="py-toggle" aria-label="拼音 — показывать пиньинь"> <span lang="zh">拼音</span></label>
    <button type="button" class="linkbtn fin" id="finish">Закончить</button>
  </header>
  <div class="log" id="log" role="log" aria-live="polite" aria-label="Реплики"></div>
  <div class="c-foot">
    <div class="weave" id="weave"></div>
    <div class="status" id="c-status" role="status" aria-live="polite"></div>
    <div class="mic-wrap" id="mic-wrap">
      <button type="button" class="mic" id="mic" aria-label="Удерживайте и говорите"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0"/><path d="M12 17v4"/></svg></button>
      <div class="mic-hint" id="mic-hint" aria-hidden="true">Удерживайте и говорите</div>
    </div>
    <form class="txt" id="txt-form" autocomplete="off" hidden>
      <label for="txt" class="sr">Реплика текстом</label>
      <input class="inp" id="txt" type="text" maxlength="300" lang="zh-CN" placeholder="Напиши по-китайски">
      <button type="submit" class="btn-p" id="txt-go">Отправить</button>
    </form>
    <button type="button" class="linkbtn small" id="txt-toggle" aria-controls="txt-form" aria-expanded="false">написать текстом</button>
  </div>
</section>

<section class="screen" id="s-sum" hidden>
  <header class="s-head">
    <div class="m" id="s-meta"></div>
    <h1 id="s-h" tabindex="-1">Разбор</h1>
    <div class="tiles">
      <div class="tl g"><div class="n" id="n-said">0</div><div class="l" id="l-said">слов сказал</div></div>
      <div class="tl a"><div class="n" id="n-corr">0</div><div class="l" id="l-corr">поправки</div></div>
      <div class="tl r"><div class="n" id="n-nr">0</div><div class="l">не вспомнил</div></div>
    </div>
  </header>
  <div class="s-body">
    <section><h2>Поправки</h2><div id="s-corr"></div></section>
    <section><h2>Не вспомнил — в повторение сегодня</h2><div class="nr" id="s-nr"></div></section>
    <section><h2>Сказал сам</h2><div class="said" id="s-said" lang="zh-CN"></div></section>
  </div>
  <div class="s-foot">
    <div class="status" id="s-status" role="status" aria-live="polite"></div>
    <div class="row"><button type="button" class="btn-p" id="again">Ещё раз</button><button type="button" class="btn-s" id="other">Другая тема</button></div>
  </div>
</section>

</div>

/* ---------- прогресс zh_srs_v1 — те же правила, что в review.html ---------- */

  if (st === 409) return e ? e.charAt(0).toUpperCase() + e.slice(1).replace(/[.!]+$/, '') + '.' : 'Предыдущая реплика ещё обрабатывается — подожди пару секунд.';

}

const wparts = (w) => String(w || '').split(/…+/).filter(Boolean);   // «如果…的话» → части, как в zhtalk/server.py weave_in

}
const extOf = (t) => (/mp4|m4a|aac/.test(t) ? 'm4a' : /webm/.test(t) ? 'webm' : /ogg/.test(t) ? 'ogg' : /wav/.test(t) ? 'wav' : 'bin');
async function getStream() {
  if (STREAM && STREAM.getTracks().some((t) => t.readyState !== 'ended')) return STREAM;
  STREAM = await navigator.mediaDevices.getUserMedia({ audio: true });
  return STREAM;
}
function stopStream() { if (STREAM) { try { STREAM.getTracks().forEach((t) => t.stop()); } catch (e) { /* */ } } STREAM = null; }
function micUi(state) {
  const mic = $('#mic'), hint = $('#mic-hint');
  mic.classList.toggle('rec', state === 'rec');
  hint.textContent = state === 'rec' ? 'Говорите… отпустите — отправлю' : 'Удерживайте и говорите';
}
async function recStart(e) {
  if (busy || REC.st !== 'idle' || !SESS) return;
  if (e && e.cancelable) e.preventDefault();
  try { if (e && e.pointerId != null && $('#mic').hasPointerCapture && $('#mic').hasPointerCapture(e.pointerId)) $('#mic').releasePointerCapture(e.pointerId); } catch (err) { /* */ }
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (err) { /* */ }
  REC.st = 'starting'; REC.cancel = false; REC.release = false; REC.chunks = [];
  setStatus('#c-status', '');
  let stream;
  try { stream = await getStream(); }
  catch (err) {
    REC.st = 'idle'; MIC_DENIED = true;
    showText(true, 'Микрофон недоступен (нет разрешения) — пиши текстом.');
    return;
  }
  if (REC.cancel || REC.release) { REC.st = 'idle'; if (REC.release) setStatus('#c-status', 'Удерживайте кнопку, пока говорите.'); return; }
  let mr;
  try { const mime = pickMime(); mr = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); }
  catch (err) { REC.st = 'idle'; showText(true, 'Запись звука не поддерживается — пиши текстом.'); return; }
  REC.mr = mr;
  mr.ondataavailable = (ev) => { if (ev.data && ev.data.size) REC.chunks.push(ev.data); };
  mr.onstop = () => recDone(mr);
  try { mr.start(); } catch (err) { REC.st = 'idle'; showText(true, 'Запись не запустилась — пиши текстом.'); return; }
  REC.st = 'rec'; REC.t0 = Date.now();
  micUi('rec');
  clearTimeout(REC.timer);
  REC.timer = setTimeout(() => { if (REC.st === 'rec') recStop(false); }, 58000);
}
function recStop(cancel) {
  if (REC.st === 'starting') { if (cancel) REC.cancel = true; else REC.release = true; return; }
  if (REC.st !== 'rec') return;
  REC.cancel = !!cancel; REC.st = 'stopping';
  clearTimeout(REC.timer);
  micUi('idle');
  try { REC.mr.stop(); } catch (e) { REC.st = 'idle'; }
}
function recDone(mr) {
  REC.st = 'idle';
  const dur = Date.now() - REC.t0;
  if (REC.cancel) { setStatus('#c-status', 'Запись отменена.'); return; }
  if (dur < 400) { setStatus('#c-status', 'Удерживайте кнопку, пока говорите.'); return; }
  const type = (mr.mimeType || (REC.chunks[0] && REC.chunks[0].type) || 'audio/mp4');
  const blob = new Blob(REC.chunks, { type: type });
  if (!blob.size) { setStatus('#c-status', 'Запись пустая — попробуй ещё раз.', true); return; }
  sendTurn({ audio: blob, ext: extOf(type) });
}
(function bindMic() {
  const mic = $('#mic');
  if (!CAN_REC) { mic.disabled = true; return; }
  const outside = (e) => { const r = mic.getBoundingClientRect(); if (!r.width) return false; const s = 16; return e.clientX < r.left - s || e.clientX > r.right + s || e.clientY < r.top - s || e.clientY > r.bottom + s; };
  mic.addEventListener('pointerdown', (e) => { if (e.button && e.button !== 0) return; recStart(e); });
  mic.addEventListener('pointerup', () => recStop(false));
  mic.addEventListener('pointercancel', () => recStop(true));
  mic.addEventListener('pointerleave', () => { if (REC.st === 'rec' || REC.st === 'starting') recStop(true); });
  mic.addEventListener('pointermove', (e) => { if ((REC.st === 'rec' || REC.st === 'starting') && outside(e)) recStop(true); });
  mic.addEventListener('contextmenu', (e) => e.preventDefault());
  mic.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); recStart(); } });
  mic.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); recStop(false); } });
})();
function stopAll() {
  if (REC.st === 'rec' || REC.st === 'starting') recStop(true);
  stopStream();
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) { /* */ }
}
async function exitChat(fromPop) {
  const keep = () => { if (fromPop) { try { history.pushState({ s: 'chat' }, ''); } catch (e) { /* нет history */ } } };
  if (busy || !SESS) { if (busy) keep(); else { SESS = null; showTopics(); } return; }
  if (SESS.turns > 0) {
    const ok = await finishSession();
    if (!ok) keep();
    else if (fromPop) { try { history.pushState({ s: 'sum' }, ''); } catch (e) { /* нет history */ } }
    return;
  }
  SESS = null; showTopics();
}
$('#back').addEventListener('click', () => {
  if (history.state && history.state.s === 'chat') history.back(); else exitChat(false);
});
window.addEventListener('popstate', () => {
  if (!$('#s-chat').hidden) exitChat(true);
  else if (!$('#s-sum').hidden) showTopics();
});
window.addEventListener('hashchange', () => {
  if (!takeKey()) return;
  stopAll(); SESS = null; TOPICS = null; LESSONS = [];
  setStatus('#k-status', ''); setStatus('#t-status', '');
  showTopics();
});

/* ---------- экран 3: разбор ---------- */
async function finishSession() {
  if (busy || !SESS) return false;
  busy = true; setBusyUi(true, 'Готовлю разбор…');
  let ok = false;
  try {
    const j = await api('POST', 'session/' + encodeURIComponent(SESS.id) + '/finish', { translate_requested: [...SESS.tr] });
    stopAll();
    const saved = markNotRecalled(j.not_recalled || []);
    renderSummary(j, saved);
    SESS = null;
    show('sum');
    try { $('#s-h').focus(); } catch (e) { /* */ }
    setStatus('#c-status', '');
    ok = true;
  } catch (e) {
    setStatus('#c-status', e.message, true);
    if (e.status === 401) setTimeout(() => showNoKey(e.message), 0);
  } finally { busy = false; setBusyUi(false); }
  return ok;
}
$('#finish').addEventListener('click', () => { finishSession(); });
function renderSummary(j, saved) {
  const said = j.said || [], corr = j.corrections || [], nr = j.not_recalled || [];
  const turns = j.turns || 0, min = j.minutes || 0;
  $('#s-meta').textContent = [j.title_ru || 'Разговор', min + ' мин', turns + ' ' + pl(turns, 'реплика', 'реплики', 'реплик')].join(' · ');
  $('#n-said').textContent = said.length; $('#l-said').textContent = pl(said.length, 'слово', 'слова', 'слов') + ' сказал';
  $('#n-corr').textContent = corr.length; $('#l-corr').textContent = pl(corr.length, 'поправка', 'поправки', 'поправок');
  $('#n-nr').textContent = nr.length;
  $('#s-corr').innerHTML = corr.length ? corr.map((c) => '<div class="corr"><div class="was hz" lang="zh-CN">' + esc(c.was && c.was.hz) + '</div>' +
    '<div class="now hz" lang="zh-CN">' + esc(c.better && c.better.hz) + '</div><div class="rule">' + esc(c.rule_ru) + '</div></div>').join('')
    : '<div class="empty">Поправок нет — чисто.</div>';
  $('#s-nr').innerHTML = nr.length ? nr.map((w) => '<span class="nrw"><span class="hz" lang="zh-CN">' + esc(w.hz) + '</span><span class="d">' +
    (w.py ? '<span class="py">' + esc(w.py) + ' · </span>' : '') + esc(w.ru) + '</span></span>').join('')
    : '<div class="empty">Все слова вспомнил сам.</div>';
  $('#s-said').innerHTML = said.length ? said.map((w, i) => '<span class="sw">' + esc(w.hz) + (i < said.length - 1 ? ' ·' : '') + '</span>').join(' ') : '—';
  setStatus('#s-status', saved < 0 ? 'Не удалось сохранить слова в «Повторение»: браузер не даёт писать в память.' : '', saved < 0);
}
$('#again').addEventListener('click', () => { if (LAST_SPEC) startSession(LAST_SPEC); else showTopics(); });
$('#other').addEventListener('click', () => showTopics());

/* ---------- старт ---------- */
if (!KEY) showNoKey(); else showTopics();
})();
</script>
</body>

  .pop .ppy{color:var(--accent);font-weight:600;font-size:13px;margin-top:2px}
  .pop .pru{margin-top:6px;font-size:15px}

  .vrow{display:flex;gap:10px;padding:9px 0;border-top:1px dashed var(--line);align-items:flex-start}

  .vrow .tr{font-size:14px;color:var(--ink)}
  .vrow .ex{font-size:13px;color:var(--muted);margin-top:2px}

  @media(max-width:560px){.vlist{grid-template-columns:1fr}}

    backdrop-filter:blur(6px);padding:12px 0;margin:0 -16px;border-bottom:1px solid var(--line)}

  .progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1e8e4f,#36c46f);

  .scoretxt{font-weight:700;font-size:15px;white-space:nowrap}

  .answerline.wrong{border-color:var(--bad);background:var(--bad-soft)}

  .mtile.sel{border-color:var(--accent);background:var(--accent-soft)}
  .mtile.matched{border-color:var(--ok);background:var(--ok-soft);cursor:default}

  .fb{margin-left:32px;margin-top:8px;font-size:14px;padding:8px 12px;border-radius:9px;display:none}

</style>
</head>

const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;}

/* ---------- рендер китайского с пиньинем + подсказками ---------- */
function cn(s){
  const segs = ANNO[s];
  if(!segs) return esc(s);              // не-китайский текст (русский, латиница) — как есть
  let html='';
  for(const seg of segs){
    if(seg.h){                          // китайское слово/иероглиф
      const chars=[...seg.w];
      let inner='';
      for(let i=0;i<chars.length;i++){
        const py=seg.p?seg.p[i]:'';
        inner += py ? `<ruby>${esc(chars[i])}<rt>${esc(py)}</rt></ruby>` : esc(chars[i]);
      }
      if(seg.g){
        const py=seg.p?seg.p.join(' '):'';
        html += `<span class="word" data-w="${esc(seg.w)}" data-py="${esc(py)}" data-ru="${esc(seg.g.ru||'')}" data-excn="${esc(seg.g.ex_cn||'')}" data-exru="${esc(seg.g.ex_ru||'')}">${inner}</span>`;
      } else html += inner;
    } else if(/^[_＿]{2,}$/.test(seg.w)){
      html += '<span class="blank">?</span>';
    } else html += esc(seg.w);
  }
  return html;
}

/* ---------- popover ---------- */
const pop=document.getElementById('pop');
let popPinned=false;
function showPop(w){
  const ex = w.dataset.excn ? `<div class="pex"><span class="excn">${cn(w.dataset.excn)}</span>${esc(w.dataset.exru||'')}</div>` : '';
  pop.innerHTML = `<div class="pw">${cn(w.dataset.w)}</div>`+
    (w.dataset.py?`<div class="ppy">${esc(w.dataset.py)}</div>`:'')+
    `<div class="pru">${esc(w.dataset.ru)}</div>`+ex;
  pop.classList.add('show');
  const r=w.getBoundingClientRect();
  const pw=pop.offsetWidth, ph=pop.offsetHeight;
  let left=r.left+window.scrollX;
  left=Math.min(left, window.scrollX+document.documentElement.clientWidth-pw-10);
  left=Math.max(left, window.scrollX+8);
  let top=r.bottom+window.scrollY+6;
  if(r.bottom+ph+10>document.documentElement.clientHeight) top=r.top+window.scrollY-ph-6;
  pop.style.left=left+'px'; pop.style.top=top+'px';
}
function hidePop(){ pop.classList.remove('show'); popPinned=false; }
document.body.addEventListener('mouseover',e=>{ const w=e.target.closest('.word'); if(w&&!popPinned) showPop(w); });
document.body.addEventListener('mouseout',e=>{ const w=e.target.closest('.word'); if(w&&!popPinned) hidePop(); });
document.body.addEventListener('click',e=>{
  const w=e.target.closest('.word');
  if(w){ e.stopPropagation(); if(popPinned&&pop._for===w){hidePop();} else {showPop(w);popPinned=true;pop._for=w;} return; }
  if(!e.target.closest('.pop')) hidePop();
});

/* ---------- pinyin / text normalization (проверка ответов) ---------- */
const TONE_MAP={'ā':'a','á':'a','ǎ':'a','à':'a','ē':'e','é':'e','ě':'e','è':'e','ī':'i','í':'i','ǐ':'i','ì':'i','ō':'o','ó':'o','ǒ':'o','ò':'o','ū':'u','ú':'u','ǔ':'u','ù':'u','ǖ':'v','ǘ':'v','ǚ':'v','ǜ':'v','ü':'v'};
function stripTones(s){let o='';for(const ch of s.toLowerCase())o+=(TONE_MAP[ch]!==undefined?TONE_MAP[ch]:ch);return o.replace(/[1-5]/g,'').replace(/\s+/g,'').replace(/[，。！？、,.!?'’\-]/g,'');}
function normHanzi(s){return s.trim().replace(/\s+/g,'').replace(/[，。！？、,.!?\s]/g,'');}
function eqv(a,b){return a.trim().toLowerCase()===b.trim().toLowerCase();}
function matchAnswer(user,accept,mode){
  user=(user||'').trim(); if(!user)return false;
  for(const a of accept){
    if(mode==='pinyin'){if(stripTones(user)===stripTones(a))return true;}
    else if(mode==='hanzi'){if(normHanzi(user)===normHanzi(a))return true;}
    else {if(eqv(user,a))return true;}
  }
  return false;
}

/* ---------- TTS ---------- */
let zhVoice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();zhVoice=vs.find(v=>/zh|chinese/i.test(v.lang+v.name))||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text){
  if(!('speechSynthesis' in window)){alert('Браузер не поддерживает озвучку.');return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=0.85;if(zhVoice)u.voice=zhVoice;
  speechSynthesis.speak(u);
}

/* ---------- scoring ---------- */
const graded={}; let totalItems=0;
function setGraded(key,ok){graded[key]=ok;refreshScore();}
function refreshScore(){
  const keys=Object.keys(graded);
  const correct=keys.filter(k=>graded[k]).length;
  document.getElementById('score').textContent=correct+' / '+totalItems;
  document.getElementById('bar').style.width=(totalItems?correct/totalItems*100:0)+'%';
  const done=document.getElementById('done');
  if(keys.length===totalItems&&totalItems>0){
    done.classList.add('show');
    const pct=Math.round(correct/totalItems*100);
    document.getElementById('doneScore').textContent=correct+' / '+totalItems+'  ('+pct+'%)';
    document.getElementById('doneMsg').textContent=pct>=90?'Отлично! 太棒了！':pct>=70?'Хорошо! 很好！':pct>=50?'Неплохо, повтори ошибки. 加油！':'Стоит повторить урок. 别灰心，再来一次！';
  } else done.classList.remove('show');
}

function feedback(el,ok,answerHTML,explain){
  el.className='fb '+(ok?'ok':'bad');
  let h=ok?'✓ Верно · 正确':'✗ Неверно · 错误';
  if(!ok&&answerHTML)h+=' — правильный ответ: <span class="ans">'+answerHTML+'</span>';
  if(explain)h+='<br><span style="color:var(--muted)">'+esc(explain)+'</span>';
  el.innerHTML=h;
}

/* ---------- renderers ---------- */
function renderMCQ(sec,sIdx){
  sec.items.forEach((it,i)=>{
    const key='s'+sIdx+'_'+i; totalItems++;
    const item=el('<div class="item"></div>');
    item.innerHTML=`<div class="qhead"><span class="qnum">${i+1}.</span><span class="qcn">${cn(it.q_cn||'')}</span></div>`+
      (it.q_ru?`<div class="qru">${esc(it.q_ru)}</div>`:'');
    const opts=el('<div class="opts"></div>'); let sel=-1;
    it.options.forEach((o,oi)=>{
      const op=el(`<div class="opt"><span class="cn">${cn(o)}</span></div>`);
      op.onclick=()=>{ if(graded[key]!==undefined)return; sel=oi;
        [...opts.children].forEach(c=>c.classList.remove('sel')); op.classList.add('sel'); };
      opts.appendChild(op);
    });
    const fb=el('<div class="fb"></div>');
    const act=el('<div class="row-actions"></div>');
    const b=el('<button class="btn ghost">Проверить</button>');
    b.onclick=()=>{ if(sel<0){fb.className='fb bad';fb.textContent='Выбери вариант · 请选择';return;}
      const ok=sel===it.answer;
      [...opts.children].forEach((c,ci)=>{c.style.pointerEvents='none';
        if(ci===it.answer)c.classList.add('correct'); if(ci===sel&&!ok)c.classList.add('wrong');});
      feedback(fb,ok,cn(it.options[it.answer]),it.explain_ru); b.disabled=true; setGraded(key,ok); };
    act.appendChild(b);
    item.appendChild(opts); item.appendChild(act); item.appendChild(fb);
    item._check=()=>{ if(graded[key]===undefined&&sel>=0) b.onclick(); };
    sec._el.appendChild(item);
  });
}

function renderFill(sec,sIdx){
  sec.items.forEach((it,i)=>{
    const key='s'+sIdx+'_'+i; totalItems++;
    const item=el('<div class="item"></div>');
    item.innerHTML=`<div class="qhead"><span class="qnum">${i+1}.</span></div>`;
    item.appendChild(el(`<div class="prompt">${cn(it.prompt_cn||'')}</div>`));
    if(it.prompt_ru) item.appendChild(el(`<div class="qru">${esc(it.prompt_ru)}</div>`));
    const inp=el(`<input class="fill" placeholder="${it.mode==='pinyin'?'pīnyīn / pinyin':it.mode==='ru'?'перевод':'汉字'}">`);
    const fb=el('<div class="fb"></div>');
    const wrap=el('<div class="inpwrap"></div>');
    const b=el('<button class="btn ghost">Проверить</button>');
    const doCheck=()=>{ if(graded[key]!==undefined)return;
      const ok=matchAnswer(inp.value,it.accept,it.mode||'hanzi');
      inp.classList.add(ok?'correct':'wrong'); inp.disabled=true; b.disabled=true;
      feedback(fb,ok,cn(it.accept[0]),it.explain_ru||it.hint_ru); setGraded(key,ok); };
    b.onclick=doCheck; inp.addEventListener('keydown',e=>{if(e.key==='Enter')doCheck();});
    wrap.appendChild(inp); wrap.appendChild(b);
    item.appendChild(wrap); item.appendChild(fb);
    item._check=()=>{ if(graded[key]===undefined&&inp.value.trim()) doCheck(); };
    sec._el.appendChild(item);
  });
}

function renderTrueFalse(sec,sIdx){
  sec.items.forEach((it,i)=>{
    const key='s'+sIdx+'_'+i; totalItems++;
    const item=el('<div class="item"></div>');
    item.innerHTML=`<div class="qhead"><span class="qnum">${i+1}.</span><span class="qcn">${cn(it.statement_cn||'')}</span></div>`+
      (it.statement_ru?`<div class="qru">${esc(it.statement_ru)}</div>`:'');
    const tf=el('<div class="tf"></div>'); const fb=el('<div class="fb"></div>');
    [['Верно · 对',true],['Неверно · 错',false]].forEach(([label,val])=>{
      const op=el(`<div class="opt">${label}</div>`);
      op.onclick=()=>{ if(graded[key]!==undefined)return;
        [...tf.children].forEach(c=>c.classList.remove('sel')); op.classList.add('sel');
        const ok=val===it.answer; [...tf.children].forEach(c=>c.style.pointerEvents='none');
        op.classList.add(ok?'correct':'wrong');
        feedback(fb,ok,(it.answer?'Верно · 对':'Неверно · 错'),it.explain_ru); setGraded(key,ok); };
      tf.appendChild(op);
    });
    item.appendChild(tf); item.appendChild(fb);
    sec._el.appendChild(item);
  });

function renderOrder(sec,sIdx){
  sec.items.forEach((it,i)=>{
    const key='s'+sIdx+'_'+i; totalItems++;
    const item=el('<div class="item"></div>');
    item.innerHTML=`<div class="qhead"><span class="qnum">${i+1}.</span></div>`+
      (it.translation_ru?`<div class="qru">Собери предложение: «${esc(it.translation_ru)}»</div>`:'<div class="qru">Собери предложение из слов</div>');
    const answer=el('<div class="answerline"></div>');
    const pool=el('<div class="chips"></div>');
    const current=[];
    const shuffled=[...it.chips].map((c,idx)=>({c,idx})).sort(()=>Math.random()-0.5);
    shuffled.forEach(({c})=>{
      const chip=el(`<div class="chip">${cn(c)}</div>`);
      chip.onclick=()=>{ if(graded[key]!==undefined)return;
        chip.classList.add('used'); current.push({c,chip});
        const a=el(`<div class="chip">${cn(c)}</div>`);
        a.onclick=()=>{ if(graded[key]!==undefined)return; chip.classList.remove('used');
          const p=current.findIndex(x=>x.chip===chip); if(p>=0)current.splice(p,1); a.remove(); };
        answer.appendChild(a); };
      pool.appendChild(chip);
    });
    const fb=el('<div class="fb"></div>');
    const act=el('<div class="row-actions"></div>');
    const b=el('<button class="btn ghost">Проверить</button>');
    b.onclick=()=>{ if(graded[key]!==undefined)return;
      const got=current.map(x=>x.c); const ok=JSON.stringify(got)===JSON.stringify(it.answer);
      answer.classList.add(ok?'correct':'wrong'); b.disabled=true;
      feedback(fb,ok,it.answer.map(cn).join(' '),it.explain_ru); setGraded(key,ok); };
    act.appendChild(b);
    item.appendChild(answer); item.appendChild(pool); item.appendChild(act); item.appendChild(fb);
    sec._el.appendChild(item);
  });
}

function renderMatch(sec,sIdx){
  const key='s'+sIdx; totalItems++;
  const item=el('<div class="item"></div>');
  const grid=el('<div class="match"></div>');
  const colL=el('<div class="col"></div>'), colR=el('<div class="col"></div>');
  const left=sec.items.map((it,idx)=>({t:it.left,idx}));
  const right=sec.items.map((it,idx)=>({t:it.right,idx})).sort(()=>Math.random()-0.5);
  let selL=null; let solved=0;
  left.forEach(o=>{ const tile=el(`<div class="mtile cn">${cn(o.t)}</div>`); tile._idx=o.idx;
    tile.onclick=()=>{ if(tile.classList.contains('matched'))return;
      [...colL.children].forEach(c=>c.classList.remove('sel')); tile.classList.add('sel'); selL=tile; };
    colL.appendChild(tile); });
  right.forEach(o=>{ const tile=el(`<div class="mtile">${cn(o.t)}</div>`); tile._idx=o.idx;
    tile.onclick=()=>{ if(!selL||tile.classList.contains('matched'))return;
      if(selL._idx===o.idx){ selL.classList.remove('sel'); selL.classList.add('matched');
        tile.classList.add('matched'); selL=null; solved++; if(solved===left.length) setGraded(key,true); }
      else { const bad=selL; bad.classList.add('wrongflash'); tile.classList.add('wrongflash');
        setTimeout(()=>{bad.classList.remove('wrongflash','sel');tile.classList.remove('wrongflash');},500);
        if(graded[key]===undefined) graded[key]=false; selL=null; } };
    colR.appendChild(tile); });
  grid.appendChild(colL); grid.appendChild(colR);
  item.appendChild(el('<div class="qru">Нажми слово слева, затем его пару справа · 连线</div>'));
  item.appendChild(grid);
  sec._el.appendChild(item);
}

function renderListen(sec,sIdx){
  sec.items.forEach((it,i)=>{
    const key='s'+sIdx+'_'+i; totalItems++;
    const item=el('<div class="item"></div>');
    item.innerHTML=`<div class="qhead"><span class="qnum">${i+1}.</span><span class="qru" style="margin:0">${esc(it.q_ru||'Что вы услышали?')}</span></div>`;
    const sb=el('<button class="speakbtn" title="Прослушать">🔊</button>');
    sb.onclick=()=>speak(it.audio_text);
    item.appendChild(sb);
    item.appendChild(el('<span class="speakhint">нажми, чтобы прослушать · 点击播放</span>'));
    const opts=el('<div class="opts"></div>'); let sel=-1;
    it.options.forEach((o,oi)=>{
      const op=el(`<div class="opt"><span class="cn">${cn(o)}</span></div>`);
      op.onclick=()=>{ if(graded[key]!==undefined)return; sel=oi;
        [...opts.children].forEach(c=>c.classList.remove('sel')); op.classList.add('sel'); };
      opts.appendChild(op);
    });
    const fb=el('<div class="fb"></div>');
    const act=el('<div class="row-actions"></div>');
    const b=el('<button class="btn ghost">Проверить</button>');
    b.onclick=()=>{ if(sel<0){fb.className='fb bad';fb.textContent='Выбери вариант · 请选择';return;}
      const ok=sel===it.answer;
      [...opts.children].forEach((c,ci)=>{c.style.pointerEvents='none';
        if(ci===it.answer)c.classList.add('correct'); if(ci===sel&&!ok)c.classList.add('wrong');});
      feedback(fb,ok,cn(it.options[it.answer]),it.explain_ru); b.disabled=true; setGraded(key,ok); };
    act.appendChild(b);
    item.appendChild(opts); item.appendChild(act); item.appendChild(fb);
    sec._el.appendChild(item);
  });
}

const RENDERERS={mcq:renderMCQ,fill:renderFill,truefalse:renderTrueFalse,order:renderOrder,match:renderMatch,listen:renderListen};

/* ---------- словарь урока (все новые слова) ---------- */
function renderVocabCard(app){
  const vocab = HW.vocab || [];
  if(!vocab.length) return;
  const sec=el('<section class="vocab"></section>');
  sec.appendChild(el('<h2>Словарь урока <span class="subcn">生词</span></h2>'));
  sec.appendChild(el(`<div class="cnt">Все новые слова урока (${vocab.length}). Нажми 🔊, чтобы прослушать. Слова из этого списка подсвечены в заданиях.</div>`));
  const list=el('<div class="vlist"></div>');
  vocab.forEach(v=>{
    const row=el('<div class="vrow"></div>');
    const b=el('<button class="spk" title="Прослушать">🔊</button>');
    b.onclick=()=>speak(v.hanzi);
    const body=el('<div class="body"></div>');
    body.appendChild(el(`<div class="hz">${cn(v.hanzi)}</div>`));
    body.appendChild(el(`<div class="tr">${esc(v.ru||'')}</div>`));
    const ex = v.ex_cn||v.example_cn;
    if(ex) body.appendChild(el(`<div class="ex"><span class="excn">${cn(ex)}</span>${(v.ex_ru||v.example_ru)?' — '+esc(v.ex_ru||v.example_ru):''}</div>`));
    row.appendChild(b); row.appendChild(body); list.appendChild(row);
  });
  sec.appendChild(list);
  app.appendChild(sec);
}

function build(){
  document.title=(HW.lesson.title_ru||HW.lesson.title_cn||'Домашнее задание');
  document.getElementById('tcn').innerHTML=cn(HW.lesson.title_cn||'');
  document.getElementById('tru').textContent=HW.lesson.title_ru||'';
  const meta=document.getElementById('meta');
  if(HW.lesson.topic_cn||HW.lesson.topic_ru) meta.appendChild(el(`<span class="tag">${esc((HW.lesson.topic_cn||'')+(HW.lesson.topic_ru?' · '+HW.lesson.topic_ru:''))}</span>`));
  if(HW.lesson.level) meta.appendChild(el(`<span class="tag alt">${esc(HW.lesson.level)}</span>`));
  const app=document.getElementById('app');
  renderVocabCard(app);
  (HW.sections||[]).forEach((sec,sIdx)=>{
    const s=el('<section class="ex"></section>');
    s.appendChild(el(`<h2>${esc(sec.title_ru||'Задание')}${sec.title_cn?` <span class="subcn">${esc(sec.title_cn)}</span>`:''}</h2>`));
    if(sec.instructions_ru||sec.instructions_cn)
      s.appendChild(el(`<div class="instr">${esc(sec.instructions_ru||'')}${sec.instructions_cn?' · '+esc(sec.instructions_cn):''}</div>`));
    sec._el=s;
    const r=RENDERERS[sec.type];
    if(r) r(sec,sIdx); else s.appendChild(el('<div class="instr">Неизвестный тип задания: '+esc(sec.type)+'</div>'));
    app.appendChild(s);
  });
  refreshScore();
}

document.getElementById('checkAll').onclick=()=>{ document.querySelectorAll('.item').forEach(it=>{ if(it._check) it._check(); }); };
document.getElementById('reset').onclick=()=>{ location.reload(); };

build();
</script>

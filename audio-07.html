/* ======================== утилиты ======================== */
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function el(h){const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function ruby(segs,fallback){ if(!segs) return esc(fallback||''); let h='';
  for(const s of segs){ if(s.h){const ch=[...s.w]; ch.forEach((c,i)=>{const p=s.p&&s.p[i]; h+=p?`<ruby>${esc(c)}<rt>${esc(p)}</rt></ruby>`:esc(c);});}
    else h+=esc(s.w);} return h; }
const TONE={'ā':'a','á':'a','ǎ':'a','à':'a','ē':'e','é':'e','ě':'e','è':'e','ī':'i','í':'i','ǐ':'i','ì':'i','ō':'o','ó':'o','ǒ':'o','ò':'o','ū':'u','ú':'u','ǔ':'u','ù':'u','ǖ':'v','ǘ':'v','ǚ':'v','ǜ':'v','ü':'v'};
function normPy(s){let o='';for(const c of (s||'').toLowerCase())o+=(TONE[c]!==undefined?TONE[c]:c);return o.replace(/u:/g,'v').replace(/[1-5\s'’·\-,.，。!?！？]/g,'');}
/* TTS */
let ZH=null;function pickV(){try{const v=speechSynthesis.getVoices();ZH=v.find(x=>/zh[-_]CN/i.test(x.lang))||v.find(x=>/zh/i.test(x.lang))||null;}catch(e){}}
if('speechSynthesis' in window){pickV();speechSynthesis.onvoiceschanged=pickV;}
function say(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.8;if(ZH)u.voice=ZH;speechSynthesis.speak(u);}

/* ======================== SRS (интервальное повторение) ========================
   Хранится в localStorage этого сайта → общий прогресс для всех уроков на одном устройстве. */
const SKEY='zh_srs_v1', IV=[0,1,2,4,7,15,30,60];
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/86400000);
function load(){try{return JSON.parse(localStorage.getItem(SKEY))||{};}catch(e){return {};}}
let S=load();
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}}
function grade(id,ok){ const t=today(); const s=S[id]||{b:0,d:t,n:0,l:0}; s.n++;
  if(ok){ s.b=Math.min(s.b+1,IV.length-1); s.d=t+IV[s.b]; } else { s.l++; s.b=Math.max(0,Math.min(s.b,1)-1); s.d=t; }
  S[id]=s; save(); }
function level(id){const s=S[id]; if(!s) return 0; return s.b>=4?2:1;}
function lvlBadge(id){const l=level(id);return `<span class="lvl n${l}">${['новое','учу','знаю'][l]}</span>`;}
function isDue(id){const s=S[id];return s&&s.d<=today();}

/* --- Карточки: самопроверка, крутим, пока все не «помню» --- */
function viewCards(box,words,{title='',onFinish}={}){
  let dir='zh', queue=shuffle(words), total=words.length, known=0, cur=null, opened=false;
  const c=el(`<div class="card">
    <div class="tools"><button class="tg on" data-d="zh">中 → RU</button><button class="tg" data-d="ru">RU → 中</button><button class="tg" data-d="au">🔊 на слух</button></div>
    <div class="prog"><i></i></div><div class="pl"><span class="pl1"></span><span class="pl2"></span></div>
    <div class="fc"></div></div>`);
  const fc=c.querySelector('.fc'), bar=c.querySelector('.prog i');
  c.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{dir=b.dataset.d;c.querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',x===b));show();});
  function upd(){bar.style.width=(known/total*100)+'%';c.querySelector('.pl1').textContent=`Запомнено ${known} из ${total}`;c.querySelector('.pl2').textContent=queue.length?`осталось ${queue.length}`:'';}
  function show(){
    upd(); if(!queue.length){ fc.innerHTML=`<div class="done"><div class="big">🎉</div><h3>Все ${total} слов пройдены${title?' · '+esc(title):''}</h3>
      <div class="muted">Слова записаны в «Повторение» — они вернутся к тебе по графику.</div><div class="row"><button class="btn g" id="again">Ещё раз</button></div></div>`;
      fc.querySelector('#again').onclick=()=>{queue=shuffle(words);known=0;show();}; onFinish&&onFinish(); return; }
    cur=queue[0]; opened=false; fc.classList.remove('open');
    const front = dir==='zh'?`<div class="big">${esc(cur.hz)}</div>`: dir==='ru'?`<div class="big ru">${esc(cur.ru)}</div>`:`<button class="spk" style="width:84px;height:84px;font-size:38px" data-say="${esc(cur.hz)}">🔊</button>`;
    fc.innerHTML=`${front}
      <div class="ans"><div class="big" style="font-size:34px">${ruby(cur.segs,cur.hz)}</div><div class="tr">${esc(cur.ru)}</div>
        ${cur.ex?`<div class="ex"><span class="c">${ruby(cur.exsegs,cur.ex)}</span>${esc(cur.ex_ru||'')}</div>`:''}
        <button class="spk" data-say="${esc(cur.hz)}">🔊</button></div>
      <div class="row q0"><button class="btn p" id="flip">Показать ответ</button></div>
      <div class="row q1" style="display:none"><button class="btn no" id="bad">✗ Не помню</button><button class="btn ok" id="good">✓ Помню</button></div>`;
    if(dir==='au') say(cur.hz);
    fc.querySelector('#flip').onclick=open;
    fc.querySelector('#bad').onclick=()=>{grade(cur.id,false);queue.shift();queue.splice(Math.min(3,queue.length),0,cur);show();};
    fc.querySelector('#good').onclick=()=>{grade(cur.id,true);queue.shift();known++;show();};
  }
  function open(){ if(opened)return; opened=true; fc.classList.add('open'); fc.querySelector('.q0').style.display='none'; fc.querySelector('.q1').style.display='flex'; if(dir!=='au') say(cur.hz); }
  box.appendChild(c); show();
}

/* --- Тест: автоматические вопросы по словам темы --- */
function viewQuiz(box,words,pool){
  pool = pool && pool.length>=4 ? pool : words;
  const TYPES=['zh2ru','ru2zh','audio','py'];
  let qs=[]; words.forEach(w=>{ const t=shuffle(TYPES).slice(0,2); t.forEach(x=>qs.push({w,t:x})); });
  qs=shuffle(qs); const total=qs.length; let right=0, i=0, firstTry=new Set(), missed=new Set();
  const c=el(`<div class="card q"><div class="prog"><i></i></div><div class="pl"><span class="pl1"></span><span class="pl2"></span></div><div class="body"></div></div>`);
  const body=c.querySelector('.body'), bar=c.querySelector('.prog i');
  function distract(w,key){ const same=shuffle(pool.filter(x=>x.id!==w.id && x[key]!==w[key])); return shuffle([w,...same.slice(0,3)]); }
  function next(){
    bar.style.width=(i/total*100)+'%'; c.querySelector('.pl1').textContent=`Вопрос ${Math.min(i+1,total)} из ${total}`; c.querySelector('.pl2').textContent=`верно ${right}`;
    if(i>=total){ const pct=Math.round(right/total*100);
      body.innerHTML=`<div class="done"><div class="big">${pct}%</div><h3>${right} из ${total} с первого раза</h3>
        <div class="muted">${pct>=90?'Отлично! 太棒了！':pct>=70?'Хорошо! 很好！':'Повтори слова с ошибками в «Карточках». 加油！'}</div>
        ${missed.size?`<div class="muted" style="margin-top:8px">Ошибки: <span style="font-family:var(--cn);color:var(--ink)">${[...missed].map(esc).join('、')}</span></div>`:''}
        <div class="row"><button class="btn g" id="again">Пройти ещё раз</button></div></div>`;
      body.querySelector('#again').onclick=()=>{box.innerHTML='';viewQuiz(box,words,pool);}; return; }
    const {w,t}=qs[i]; let ask='',prompt='',ans='';
    if(t==='zh2ru'){ask='Что значит?';prompt=`<div class="big">${esc(w.hz)}</div>`;}
    if(t==='ru2zh'){ask='Как по-китайски?';prompt=`<div class="big ru">${esc(w.ru)}</div>`;}
    if(t==='audio'){ask='Прослушай и выбери';prompt=`<button class="spk" style="width:76px;height:76px;font-size:34px" data-say="${esc(w.hz)}">🔊</button>`;}
    if(t==='py'){ask='Впиши пиньинь (тоны можно не ставить)';prompt=`<div class="big">${esc(w.hz)}</div><div class="muted">${esc(w.ru)}</div>`;}
    body.innerHTML=`<div class="prompt">${prompt}</div><div class="ask">${ask}</div><div class="zone"></div><div class="fb"></div><div class="row nx" style="display:none"><button class="btn p" id="nx">Дальше →</button></div>`;
    const zone=body.querySelector('.zone'), fb=body.querySelector('.fb');
    const finish=(ok)=>{ if(ok){ if(!missed.has(w.hz)){right++;} grade(w.id,true); fb.className='fb ok'; fb.innerHTML='✓ Верно'; }
      else { missed.add(w.hz); grade(w.id,false); fb.className='fb bad'; fb.innerHTML=`✗ Правильно: <span class="c">${ruby(w.segs,w.hz)}</span> — ${esc(w.ru)}`; }
      body.querySelector('.nx').style.display='flex'; say(w.hz); };
    body.querySelector('#nx').onclick=()=>{i++;next();};
    if(t==='py'){ const inp=el(`<input class="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="например: ni hao">`);
      const b=el(`<div class="row"><button class="btn p">Проверить</button></div>`); zone.append(inp,b); inp.focus({preventScroll:true});
      const go=()=>{ if(inp.disabled||!inp.value.trim())return; const ok=normPy(inp.value)===normPy(w.py); inp.disabled=true; inp.classList.add(ok?'right':'wrong'); b.remove(); finish(ok); };
      b.querySelector('button').onclick=go; inp.onkeydown=e=>{if(e.key==='Enter')go();}; }
    else { const key=t==='zh2ru'?'ru':'hz'; const os=distract(w,key); const box2=el('<div class="opts"></div>');
      os.forEach(o=>{ const b=el(`<button class="opt ${key==='hz'?'cn':''}">${key==='hz'?esc(o.hz):esc(o.ru)}</button>`);
        b.onclick=()=>{ if(box2.dataset.done)return; box2.dataset.done=1; const ok=o.id===w.id;
          [...box2.children].forEach((x,k)=>{ if(os[k].id===w.id)x.classList.add('right'); }); if(!ok)b.classList.add('wrong'); finish(ok); };
        box2.appendChild(b); }); zone.appendChild(box2);
      if(t==='audio') setTimeout(()=>say(w.hz),250); }
  }
  box.appendChild(c); next();
}

    <button class="mode on" data-m="learn">📖 Учить<small>слова темы</small></button>
    <button class="mode" data-m="cards">🃏 Карточки<small>вспомни сам</small></button>
    <button class="mode" data-m="quiz">✅ Тест<small>автопроверка</small></button></div><div class="view"></div>`;
  const tabs=app.querySelector('.tabs'), view=app.querySelector('.view');
  let ti=0, mode='learn';
  const list=[{title_ru:'Все темы',words:all},...topics];
  list.forEach((t,k)=>{ const b=el(`<button class="tab ${k===1?'on':''}">${esc(t.title_ru)}<span class="n">${t.words.length}</span></button>`);
    b.onclick=()=>{ti=k;tabs.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render();}; tabs.appendChild(b); });
  ti=topics.length?1:0; if(!topics.length) tabs.firstChild.classList.add('on');
  app.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.m;app.querySelectorAll('.mode').forEach(x=>x.classList.toggle('on',x===b));render();});
  function render(){ view.innerHTML=''; const t=list[ti];
    if(t.title_cn||t.note) view.appendChild(el(`<div class="muted" style="margin-top:6px"><b style="font-family:var(--cn);color:var(--accent)">${esc(t.title_cn||'')}</b> ${esc(t.note||'')}</div>`));
    if(mode==='learn') viewLearn(view,t.words);
    if(mode==='cards') viewCards(view,t.words,{title:t.title_ru,onFinish:stats});
    if(mode==='quiz') viewQuiz(view,t.words,all);
    stats(); }
  render();
}

/* ======================== страница «Повторение» ======================== */
function reviewPage(){
  const W=DATA.words; const byId={}; W.forEach(w=>byId[w.id]=w);
  $('#tcn').textContent='复习 · Повторение'; $('#tru').textContent='Интервальное повторение всех слов из уроков: каждое слово возвращается, когда пора его освежить.';
  const NK='zh_srs_new', LK='zh_srs_lim';
  const lim=+(localStorage.getItem(LK)||15);
  function newToday(){try{const o=JSON.parse(localStorage.getItem(NK))||{};return o.d===today()?o.n:0;}catch(e){return 0;}}
  function bumpNew(){const n=newToday()+1;try{localStorage.setItem(NK,JSON.stringify({d:today(),n}));}catch(e){}}
  const lessons=[...new Set(W.map(w=>w.lesson))];
  let sel=JSON.parse(localStorage.getItem('zh_srs_sel')||'null')||lessons;
  const app=$('#app');
  function counts(){ const ws=W.filter(w=>sel.includes(w.lesson)); return {
    due:ws.filter(w=>isDue(w.id)).length, fresh:ws.filter(w=>!S[w.id]).length,
    know:ws.filter(w=>level(w.id)===2).length, learn:ws.filter(w=>level(w.id)===1).length, all:ws.length}; }
  function home(){ S=load(); const c=counts(); const left=Math.max(0,lim-newToday());
    $('#stats').innerHTML=`<span class="pill r">к повторению ${c.due}</span><span class="pill">новых ${c.fresh}</span><span class="pill b">учу ${c.learn}</span><span class="pill g">знаю ${c.know}</span>`;
    app.innerHTML=`<div class="card"><h3>Сегодня</h3>
      <div class="muted">Повторить: <b>${c.due}</b> · новых слов можно взять ещё: <b>${Math.min(left,c.fresh)}</b> (лимит ${lim}/день)</div>
      <div class="row" style="justify-content:flex-start;margin-top:12px"><button class="btn p" id="go" ${c.due+Math.min(left,c.fresh)===0?'disabled':''}>▶ Начать (${c.due+Math.min(left,c.fresh)})</button>
      <button class="btn g" id="extra">+10 новых</button></div></div>
      <div class="card"><h3>Настройки</h3><div class="muted" style="margin-bottom:8px">Новых слов в день:
        <select id="lim">${[5,10,15,20,30,50].map(n=>`<option ${n===lim?'selected':''}>${n}</option>`).join('')}</select></div>
        <div class="muted" style="margin:10px 0 6px">Какие уроки повторять:</div><div class="tools" id="ls"></div></div>
      <div class="card"><h3>Как это работает</h3><div class="muted">Нажимай «Помню», если вспомнил сам, и «Не помню», если нет. Знакомое слово вернётся через 1 → 2 → 4 → 7 → 15 → 30 → 60 дней; забытое — уже сегодня. Слова, пройденные в «Карточках» и «Тесте» на страницах уроков, тоже попадают сюда. Прогресс хранится в этом браузере на этом устройстве.</div></div>`;
    const ls=app.querySelector('#ls'); lessons.forEach(l=>{ const b=el(`<button class="tg ${sel.includes(l)?'on':''}">${esc(l)}</button>`);
      b.onclick=()=>{ sel=sel.includes(l)?sel.filter(x=>x!==l):[...sel,l]; localStorage.setItem('zh_srs_sel',JSON.stringify(sel)); home(); }; ls.appendChild(b); });
    app.querySelector('#lim').onchange=e=>{localStorage.setItem(LK,e.target.value);location.reload();};
    app.querySelector('#go').onclick=()=>start(Math.min(left,c.fresh));
    app.querySelector('#extra').onclick=()=>start(Math.min(10,c.fresh),true);
  }
  function start(nNew,onlyNew){ const ws=W.filter(w=>sel.includes(w.lesson));
    const due=onlyNew?[]:shuffle(ws.filter(w=>isDue(w.id)));
    const fresh=ws.filter(w=>!S[w.id]).sort((a,b)=>b.order-a.order).slice(0,nNew);   // новые — из самых свежих уроков
    fresh.forEach(()=>bumpNew());
    const set=[...due,...fresh]; if(!set.length){home();return;}
    app.innerHTML='<div class="row" style="justify-content:flex-start;margin-top:8px"><button class="btn g" id="back">← Назад</button></div><div class="v"></div>';
    app.querySelector('#back').onclick=home;
    viewCards(app.querySelector('.v'),set,{title:'повторение',onFinish:()=>{S=load();}});
  }
  home();
}

if(DATA.mode==='review') reviewPage(); else lessonPage();
</script>
</body>
